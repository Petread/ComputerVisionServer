name: Edge Offline Bundles

on:
  pull_request:
    paths:
      - "backend/services/edge-agent/**"
      - "backend/packages/cv-status/**"
      - "backend/packages/cv-contracts/**"
      - "backend/packages/cv-utils/**"
      - "backend/packages/cv-runtime/**"
      - "deployment/edge/**"
      - "scripts/release/**"
      - "tests/**/test_edge_e2_*"
      - ".github/workflows/edge-offline-bundles.yml"
  workflow_dispatch:

jobs:
  deterministic-builder:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: python -m pip install pytest pydantic fastapi

      - name: Build native Windows GUI
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File
          deployment/edge/bundle-builder/Build-NativeBundleBuilder.ps1
          -OutputDirectory dist/edge-bundle-builder

      - name: Verify deterministic bundles, checksums and profiles
        shell: powershell
        run: |
          python -m pytest --confcutdir=tests/unit/backend tests/unit/backend/test_edge_e2_bundle_builder.py -q
          python -m pytest --confcutdir=tests/contract tests/contract/test_edge_e2_contracts.py -q

      - name: Upload native builder application
        uses: actions/upload-artifact@v4
        with:
          name: ybb-edge-offline-bundle-builder-windows
          if-no-files-found: error
          path: |
            dist/edge-bundle-builder/YBB-Edge-Bundle-Builder.exe
            deployment/edge/**
            scripts/release/build_edge_offline_bundle.py
            backend/packages/cv-status/**
            backend/packages/cv-contracts/**
            backend/packages/cv-utils/**
            backend/packages/cv-runtime/**
            backend/services/edge-agent/**

  edge-agent-platform-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Sync workspace
        run: uv sync --dev

      - name: Validate inventory and camera adapters
        run: >-
          uv run pytest tests/unit/backend/test_edge_e2_bundle_builder.py
          tests/unit/backend/test_edge_e2_inventory_cameras.py
          tests/contract/test_edge_e2_contracts.py -q

      - name: Lint E2 implementation
        run: >-
          uv run ruff check scripts/release/build_edge_offline_bundle.py
          backend/services/edge-agent/src/edge_agent/cameras.py
          backend/services/edge-agent/src/edge_agent/graph.py
          backend/services/edge-agent/src/edge_agent/inventory.py
          backend/services/edge-agent/src/edge_agent/runtime.py
          backend/services/edge-agent/src/edge_agent/state.py
