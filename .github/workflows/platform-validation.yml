name: Platform Validation

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend-contracts-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Sync Python workspace
        run: uv sync --dev

      - name: Refresh generated schema and OpenAPI
        run: |
          uv run python scripts/dev/export_config_schema.py
          uv run python scripts/dev/export_openapi.py

      - name: Assert generated artifacts are committed
        run: git diff --exit-code -- config/schemas/platform-settings.schema.json contracts/openapi

      - name: Run backend unit, contract, and integration suites
        run: uv run pytest tests/unit/backend tests/contract tests/integration -ra

  workflow-and-reliability:
    runs-on: ubuntu-latest
    needs: backend-contracts-and-integration
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Sync Python workspace
        run: uv sync --dev

      - name: Run e2e, performance smoke, and acceptance suites
        run: uv run pytest tests/e2e tests/performance tests/acceptance -ra

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin web
        run: pnpm build:admin-web
