        condition: service_started
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - data
      - observability

  label-studio-ml-adapter:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: uvicorn inference_gateway.main_labelstudio_ml_adapter:app --host 0.0.0.0 --port 8089
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      triton-rt:
        condition: service_started
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - data
      - observability

  runtime-admin-api:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    restart: unless-stopped
    command: uvicorn runtime_admin_api.main:app --host 0.0.0.0 --port 8090
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - observability

  channel-service:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: uvicorn channel_service.main:app --host 0.0.0.0 --port 8091
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - observability

  pipeline-definition-service:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: uvicorn pipeline_definition_service.main:app --host 0.0.0.0 --port 8092
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - observability

  runtime-orchestrator:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    restart: unless-stopped
    command: uvicorn runtime_orchestrator.main:app --host 0.0.0.0 --port 8093
    environment:
      <<: *python-env
      ENV: dev
      CV_PLATFORM__RUNTIME__STREAM_MEDIAMTX_API_URL: http://mediamtx:9997
      CV_PLATFORM__RUNTIME__STREAM_RTSP_PUBLISH_HOST: mediamtx
      CV_PLATFORM__RUNTIME__STREAM_AUTH_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inference-gateway-rt:
        condition: service_healthy
      mediamtx:
        condition: service_started
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - data
      - observability

  mediamtx:
    image: bluenviron/mediamtx:1.19.0
    restart: unless-stopped
    command: /mediamtx /etc/mediamtx/mediamtx.yml
    ports:
      - "127.0.0.1:9997:9997"
      - "8554:8554"
      - "8889:8889"
      - "8189:8189"
    volumes:
      - ../mediamtx/mediamtx.yml:/etc/mediamtx/mediamtx.yml:ro
    networks:
      - data
      - observability

  camera-media:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: uvicorn camera_media.main:app --host 0.0.0.0 --port 8102
    restart: unless-stopped
    gpus: all
    ipc: host
    environment:
      <<: *python-env
      ENV: dev
      CV_PLATFORM__RUNTIME__STREAM_MEDIAMTX_API_URL: http://mediamtx:9997
      CV_PLATFORM__RUNTIME__STREAM_RTSP_PUBLISH_HOST: mediamtx
    depends_on:
      postgres:
        condition: service_healthy
      mediamtx:
        condition: service_started
    volumes:
      - ../..:/workspace
      - camera_media_runtime:/run/ybb-camera-media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - data
      - observability

  realtime-executor:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: uvicorn realtime_executor.main:app --host 0.0.0.0 --port 8094
    gpus: all
    ipc: host
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      inference-gateway-rt:
        condition: service_healthy
      camera-media:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
      - camera_media_runtime:/run/ybb-camera-media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - data
      - observability

  trigger-executor:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: uvicorn trigger_executor.main:app --host 0.0.0.0 --port 8095
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      inference-gateway-rt:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - data
      - observability

  overlay-service:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: uvicorn overlay_service.main:app --host 0.0.0.0 --port 8096
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - observability

  capture-service:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: uvicorn capture_service.main:app --host 0.0.0.0 --port 8097
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      label-studio:
        condition: service_started
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - observability

  result-service:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: uvicorn result_service.main:app --host 0.0.0.0 --port 8098
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8098/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - observability

  connector-service:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: uvicorn connector_service.main:app --host 0.0.0.0 --port 8099
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - observability

  control-worker:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: python -m control_worker.worker
    environment:
      <<: *python-env
      ENV: dev
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    networks:
      - control
      - data

  training-worker:
    build:
      context: ../..
      dockerfile: infra/docker/training-worker.Dockerfile
      args:
        UV_SYNC_ARGS: --all-packages --group training-runtime
    command: python -m training_worker.worker
    gpus: all
    environment:
      <<: *python-env
      ENV: dev
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    networks:
      - control

  batch-worker:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: python -m batch_worker.worker
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    networks:
      - control
      - data

  maintenance-worker:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: python -m maintenance_worker.worker
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    networks:
      - control

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control

  redis:
    image: redis:7.4
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control

  label-studio:
    image: heartexlabs/label-studio:latest
    environment:
      HOST: ${LABEL_STUDIO_HOST:-http://localhost/label-studio}
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /srv/cv-platform
      DJANGO_DB: default
      POSTGRE_NAME: labelstudio
      POSTGRE_USER: postgres
      POSTGRE_PASSWORD_FILE: /run/secrets/postgres_app_password
      POSTGRE_HOST: postgres
      POSTGRE_PORT: 5432
    entrypoint:
      - sh
      - -c
      - |
        export POSTGRE_PASSWORD="$$(cat /run/secrets/postgres_app_password)"
        exec ./deploy/docker-entrypoint.sh label-studio
    volumes:
      - labelstudio_data:/label-studio/data
      - ../../.local/state/runtime:/srv/cv-platform/runtime:ro
      - ../../.local/state/control/uploads:/srv/cv-platform/control/uploads:ro
      - ../secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - control

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: >
      sh -c "pip install --quiet psycopg2-binary &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://postgres:$$(cat /run/secrets/postgres_app_password)@postgres:5432/mlflow
      --artifacts-destination /mlflow/artifacts"
    volumes:
      - mlflow_data:/mlflow/artifacts
      - ../secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - control

  triton-rt:
    image: nvcr.io/nvidia/tritonserver:24.08-py3
    gpus: all
    command: >
      tritonserver
      --model-repository=/models
      --model-control-mode=explicit
      --http-port=8000
      --grpc-port=8001
    volumes:
      - ../../.local/state/serving/triton/realtime:/models
    networks:
      - data

  triton-batch:
    image: nvcr.io/nvidia/tritonserver:24.08-py3
    gpus: all
    command: >
      tritonserver
      --model-repository=/models
      --model-control-mode=explicit
      --http-port=8000
      --grpc-port=8001
    volumes:
      - ../../.local/state/serving/triton/batch:/models
    networks:
      - data

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    volumes:
      - ../observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    networks:
      - observability
      - control
      - data

  grafana:
    image: grafana/grafana:11.2.0
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - observability

volumes:
  postgres_data:
  redis_data:
  labelstudio_data:
  mlflow_data:
  grafana_data:
  camera_media_runtime:

networks:
  edge:
  control:
  data:
  observability:
