name: cv-platform-dev

x-python-env: &python-env
  PYTHONPATH: "/workspace/backend/packages/cv-core/src:/workspace/backend/packages/cv-contracts/src:/workspace/backend/packages/cv-db/src:/workspace/backend/packages/cv-deploy/src:/workspace/backend/packages/cv-runtime/src:/workspace/backend/packages/cv-datasets/src:/workspace/backend/packages/cv-events/src:/workspace/backend/packages/cv-observability/src:/workspace/backend/packages/cv-status/src:/workspace/backend/packages/cv-training/src:/workspace/backend/packages/cv-utils/src:/workspace/backend/services/admin-api/src:/workspace/backend/services/dataset-service/src:/workspace/backend/services/deployment-controller/src:/workspace/backend/services/inference-gateway/src:/workspace/backend/services/model-registry-service/src:/workspace/backend/services/training-orchestrator/src:/workspace/backend/services/webhook-receiver/src:/workspace/backend/services/runtime-admin-api/src:/workspace/backend/services/channel-service/src:/workspace/backend/services/pipeline-definition-service/src:/workspace/backend/services/runtime-orchestrator/src:/workspace/backend/services/realtime-executor/src:/workspace/backend/services/camera-media/src:/workspace/backend/services/trigger-executor/src:/workspace/backend/services/overlay-service/src:/workspace/backend/services/capture-service/src:/workspace/backend/services/result-service/src:/workspace/backend/services/connector-service/src:/workspace/backend/workers/batch-worker/src:/workspace/backend/workers/control-worker/src:/workspace/backend/workers/maintenance-worker/src:/workspace/backend/workers/training-worker/src"

services:
  reverse-proxy:
    image: caddy:2.8.4
    ports:
      - "80:80"
    volumes:
      - ../reverse-proxy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ../../tests:/srv/tests:ro
      - ../../.local/state/runtime:/srv/cv-platform/runtime:ro
      - ../../.local/state/control/uploads:/srv/cv-platform/control/uploads:ro
    depends_on:
      admin-web:
        condition: service_started
      admin-api:
        condition: service_healthy
      dataset-service:
        condition: service_healthy
      training-orchestrator:
        condition: service_healthy
      model-registry-service:
        condition: service_healthy
      deployment-controller:
        condition: service_healthy
      inference-gateway-rt:
        condition: service_healthy
      inference-gateway-batch:
        condition: service_healthy
      runtime-admin-api:
        condition: service_healthy
      mediamtx:
        condition: service_started
      trigger-executor:
        condition: service_healthy
      overlay-service:
        condition: service_healthy
    networks:
      - edge
      - control
      - data

  admin-web:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
    command: pnpm --filter @cv-platform/admin-web dev --host 0.0.0.0 --port 4173
    environment:
      VITE_ADMIN_API_URL: http://localhost
      VITE_RUNTIME_ADMIN_API_URL: http://localhost/runtime-api
      VITE_RESULT_SERVICE_URL: http://localhost/runtime-results
      VITE_TRIGGER_EXECUTOR_URL: http://localhost/runtime-trigger
      VITE_INFERENCE_GATEWAY_RT_URL: http://localhost/inference-rt
      VITE_INFERENCE_GATEWAY_BATCH_URL: http://localhost/inference-batch
      VITE_ADMIN_WS_URL: ws://localhost
      VITE_FRONTEND_BASE_PATH: /frontend/
      VITE_USE_POLLING: "true"
      VITE_HMR_HOST: localhost
      VITE_HMR_CLIENT_PORT: "80"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "250"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../../package.json:/workspace/package.json:ro
      - ../../pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml:ro
      - ../../pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
      - ../../frontend:/workspace/frontend
      - /workspace/node_modules
      - /workspace/frontend/apps/admin-web/node_modules
      - /workspace/frontend/packages/api-client/node_modules
      - /workspace/frontend/packages/schemas/node_modules
      - /workspace/frontend/packages/ui-kit/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4173"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edge

  migrations:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: alembic -c backend/migrations/alembic.ini upgrade head
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    networks:
      - control

  admin-api:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: uvicorn admin_api.main:app --host 0.0.0.0 --port 8080
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - observability

  dataset-service:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: uvicorn dataset_service.main:app --host 0.0.0.0 --port 8082
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - observability

  training-orchestrator:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: uvicorn training_orchestrator.main:app --host 0.0.0.0 --port 8083
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - observability

  model-registry-service:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: uvicorn model_registry_service.main:app --host 0.0.0.0 --port 8084
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
