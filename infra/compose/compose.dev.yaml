    command: uvicorn deployment_controller.main:app --host 0.0.0.0 --port 8085
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - data
      - observability

  webhook-receiver:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: uvicorn webhook_receiver.main:app --host 0.0.0.0 --port 8086
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - observability

  inference-gateway-rt:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: uvicorn inference_gateway.main_realtime:app --host 0.0.0.0 --port 8087
    environment:
      <<: *python-env
      ENV: dev
    depends_on:
      triton-rt:
        condition: service_started
    volumes:
      - ../..:/workspace
      - ../secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control
      - data
      - observability

  inference-gateway-batch:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
    command: uvicorn inference_gateway.main_batch:app --host 0.0.0.0 --port 8088
    environment:
