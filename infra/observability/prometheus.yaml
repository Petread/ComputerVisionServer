global:
  scrape_interval: 15s

scrape_configs:
  - job_name: admin-api
    metrics_path: /metrics
    static_configs:
      - targets: ['admin-api:8080']
  - job_name: dataset-service
    metrics_path: /metrics
    static_configs:
      - targets: ['dataset-service:8082']
  - job_name: training-orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ['training-orchestrator:8083']
  - job_name: model-registry-service
    metrics_path: /metrics
    static_configs:
      - targets: ['model-registry-service:8084']
  - job_name: deployment-controller
    metrics_path: /metrics
    static_configs:
      - targets: ['deployment-controller:8085']
  - job_name: webhook-receiver
    metrics_path: /metrics
    static_configs:
      - targets: ['webhook-receiver:8086']
  - job_name: inference-gateway-rt
    metrics_path: /metrics
    static_configs:
      - targets: ['inference-gateway-rt:8087']
  - job_name: inference-gateway-batch
    metrics_path: /metrics
    static_configs:
      - targets: ['inference-gateway-batch:8088']
  - job_name: runtime-admin-api
    metrics_path: /metrics
    static_configs:
      - targets: ['runtime-admin-api:8090']
  - job_name: runtime-plane
    metrics_path: /api/v1/runtime/metrics
