[project]
name = "cv-platform-monorepo"
version = "0.1.0"
description = "Production-grade, open-source, on-prem computer vision platform monorepo"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
environments = [
  "sys_platform == 'linux' and python_version == '3.11'",
  "sys_platform == 'linux' and python_version == '3.12'",
  "sys_platform == 'win32' and python_version == '3.11'",
  "sys_platform == 'win32' and python_version == '3.12'",
]

[tool.uv.workspace]
members = [
  "backend/packages/cv-core",
  "backend/packages/cv-contracts",
  "backend/packages/cv-deploy",
  "backend/packages/cv-edge",
  "backend/packages/cv-runtime",
  "backend/packages/cv-training",
  "backend/packages/cv-datasets",
  "backend/packages/cv-events",
  "backend/packages/cv-status",
  "backend/packages/cv-utils",
  "backend/packages/cv-db",
  "backend/packages/cv-observability",
  "backend/services/admin-api",
  "backend/services/webhook-receiver",
  "backend/services/dataset-service",
  "backend/services/training-orchestrator",
  "backend/services/model-registry-service",
  "backend/services/inference-gateway",
  "backend/services/deployment-controller",
  "backend/services/runtime-admin-api",
  "backend/services/channel-service",
  "backend/services/pipeline-definition-service",
  "backend/services/runtime-orchestrator",
  "backend/services/realtime-executor",
  "backend/services/camera-media",
  "backend/services/trigger-executor",
  "backend/services/overlay-service",
  "backend/services/capture-service",
  "backend/services/result-service",
  "backend/services/connector-service",
  "backend/services/operations-agent",
  "backend/services/edge-agent",
  "backend/workers/control-worker",
  "backend/workers/training-worker",
  "backend/workers/batch-worker",
  "backend/workers/maintenance-worker",
]

[tool.uv.sources]
cv-core = { workspace = true }
cv-contracts = { workspace = true }
cv-deploy = { workspace = true }
cv-edge = { workspace = true }
cv-runtime = { workspace = true }
cv-training = { workspace = true }
cv-datasets = { workspace = true }
cv-events = { workspace = true }
cv-status = { workspace = true }
cv-utils = { workspace = true }
cv-db = { workspace = true }
cv-observability = { workspace = true }
admin-api = { workspace = true }
webhook-receiver = { workspace = true }
dataset-service = { workspace = true }
training-orchestrator = { workspace = true }
model-registry-service = { workspace = true }
inference-gateway = { workspace = true }
deployment-controller = { workspace = true }
runtime-admin-api = { workspace = true }
channel-service = { workspace = true }
pipeline-definition-service = { workspace = true }
runtime-orchestrator = { workspace = true }
realtime-executor = { workspace = true }
camera-media = { workspace = true }
trigger-executor = { workspace = true }
overlay-service = { workspace = true }
capture-service = { workspace = true }
result-service = { workspace = true }
connector-service = { workspace = true }
operations-agent = { workspace = true }
edge-agent = { workspace = true }
control-worker = { workspace = true }
training-worker = { workspace = true }
batch-worker = { workspace = true }
maintenance-worker = { workspace = true }

[dependency-groups]
dev = [
  "alembic>=1.13.2,<2",
  "mypy>=1.11.1,<2",
  "pytest>=8.3.2,<9",
  "pytest-asyncio>=0.24.0,<1",
  "pytest-cov>=5.0.0,<6",
  "pytest-mock>=3.14.0,<4",
  "ruff>=0.6.2,<1",
  "types-PyYAML>=6.0.12.20240917",
]
training-runtime = [
  "torch @ https://download.pytorch.org/whl/cu118/torch-2.0.0%2Bcu118-cp311-cp311-linux_x86_64.whl ; python_version == '3.11' and platform_system == 'Linux'",
  "torchvision @ https://download.pytorch.org/whl/cu118/torchvision-0.15.1%2Bcu118-cp311-cp311-linux_x86_64.whl ; python_version == '3.11' and platform_system == 'Linux'",
  "albumentations<2 ; python_version == '3.11' and platform_system == 'Linux'",
  "numpy<2 ; python_version == '3.11' and platform_system == 'Linux'",
  "setuptools<81 ; python_version == '3.11' and platform_system == 'Linux'",
  "ultralytics>=8.4.0 ; python_version == '3.11' and platform_system == 'Linux'",
  "mmcv @ https://download.openmmlab.com/mmcv/dist/cu118/torch2.0.0/mmcv-2.0.1-cp311-cp311-manylinux1_x86_64.whl ; python_version == '3.11' and platform_system == 'Linux'",
  "mmengine>=0.7.1,<1.0.0",
  "mmdet>=3.0.0,<3.1.0",
  "mmyolo==0.6.0",
  "mmdeploy==1.3.1",
  "anomalib[openvino]>=1.2,<3 ; python_version == '3.11' and platform_system == 'Linux'",
  "openvino>=2024.0,<2026 ; python_version == '3.11' and platform_system == 'Linux'",
  "onnx @ https://files.pythonhosted.org/packages/b1/2f/91092557ed478e323a2b4471e2081fdf88d1dd52ae988ceaf7db4e4506ff/onnx-1.17.0-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl ; python_version == '3.11' and platform_system == 'Linux' and platform_machine == 'x86_64'",
  "onnxruntime @ https://files.pythonhosted.org/packages/fa/ca/769da06e76b14a315a1effa5b01d906963379495cd82c00b5023be4c3e61/onnxruntime-1.19.0-cp311-cp311-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl ; python_version == '3.11' and platform_system == 'Linux' and platform_machine == 'x86_64'",
]

[tool.uv.dependency-groups]
training-runtime = { requires-python = "==3.11.*" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "backend",
  "scripts",
  "tests",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "N",
  "ANN",
]
ignore = [
  "ANN101",
  "ANN102",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = [
  "backend/packages/cv-core/src",
  "backend/packages/cv-contracts/src",
  "backend/packages/cv-deploy/src",
  "backend/packages/cv-edge/src",
  "backend/packages/cv-runtime/src",
  "backend/packages/cv-training/src",
  "backend/packages/cv-datasets/src",
  "backend/packages/cv-events/src",
  "backend/packages/cv-status/src",
  "backend/packages/cv-utils/src",
  "backend/packages/cv-db/src",
  "backend/packages/cv-observability/src",
  "backend/services/admin-api/src",
  "backend/services/webhook-receiver/src",
  "backend/services/dataset-service/src",
  "backend/services/training-orchestrator/src",
  "backend/services/model-registry-service/src",
  "backend/services/inference-gateway/src",
  "backend/services/deployment-controller/src",
  "backend/services/runtime-admin-api/src",
  "backend/services/channel-service/src",
  "backend/services/pipeline-definition-service/src",
  "backend/services/runtime-orchestrator/src",
  "backend/services/realtime-executor/src",
  "backend/services/camera-media/src",
  "backend/services/trigger-executor/src",
  "backend/services/overlay-service/src",
  "backend/services/capture-service/src",
  "backend/services/result-service/src",
  "backend/services/connector-service/src",
  "backend/services/operations-agent/src",
  "backend/services/edge-agent/src",
  "backend/workers/control-worker/src",
  "backend/workers/training-worker/src",
  "backend/workers/batch-worker/src",
  "backend/workers/maintenance-worker/src",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
strict_optional = true
ignore_missing_imports = true
