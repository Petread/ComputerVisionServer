task_type: classification
recipe_name: baseline_cls_yolo
recipe_version: 1.2.0
framework: ultralytics
trainer_backend: ultralytics-yolo
architecture_family: yolo
supported_versions:
  - v11
  - v26
supported_sizes:
  - n
  - s
  - m
  - l
  - x
image_size: 960
optimizer: adamw
optimizer_settings:
  weight_decay: 0.0005
learning_rate: 0.00085
epochs: 70
batch_size: 12
checkpoint_interval_steps: 25
early_stopping_patience: 100
early_stopping_min_delta: 0.0
best_metric_name: accuracy_top1
best_metric_mode: max
max_keep_ckpts: 5
pretrained: auto
pretrained_checkpoint: auto
scratch_training_min_items: 2000
onnx_opset: 13
postprocessing:
  confidence_threshold_default: 0.5
  top_k: 5
