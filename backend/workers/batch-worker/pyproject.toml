[project]
name = "batch-worker"
version = "0.1.0"
description = "Batch inference orchestration worker"
requires-python = ">=3.11"
dependencies = [
  "redis>=5.0.8,<6",
  "rq>=1.16.2,<2",
  "cv-core",
  "cv-db",
  "inference-gateway",
  "cv-utils",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batch_worker"]
