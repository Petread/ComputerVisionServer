[project]
name = "maintenance-worker"
version = "0.1.0"
description = "Scheduled maintenance worker"
requires-python = ">=3.11"
dependencies = [
  "redis>=5.0.8,<6",
  "rq>=1.16.2,<2",
  "cv-core",
  "cv-db",
  "cv-utils",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maintenance_worker"]
