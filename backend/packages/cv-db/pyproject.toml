[project]
name = "cv-db"
version = "0.1.0"
description = "Shared SQLAlchemy models, repositories, and session helpers"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0.34,<3",
  "psycopg[binary]>=3.2.1,<4",
  "cv-core",
  "cv-contracts",
  "cv-datasets",
  "cv-status",
  "cv-utils",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_db"]
