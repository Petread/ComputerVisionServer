[project]
name = "cv-events"
version = "0.1.0"
description = "Shared event envelopes and event payload schemas for the CV platform"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8.2,<3",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_events"]
