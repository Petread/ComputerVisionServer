[project]
name = "cv-runtime"
version = "0.1.0"
description = "Shared runtime-plane domain rules, topology, and service boundary metadata"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.2,<1",
  "pydantic>=2.8.2,<3",
  "pillow>=10.4.0,<12",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10.0,<5",
  "python-snap7>=3,<4",
  "cv-contracts",
  "cv-status",
  "cv-utils",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_runtime"]
