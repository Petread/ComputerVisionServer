[project]
name = "cv-deploy"
version = "0.1.0"
description = "Deployment packaging, compatibility checks, and Triton repository management"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.2,<1",
  "pydantic>=2.8.2,<3",
  "cv-core",
  "cv-status",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_deploy", "src/tensorrt"]
