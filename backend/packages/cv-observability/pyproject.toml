[project]
name = "cv-observability"
version = "0.1.0"
description = "Structured logging, health probes, and exception handling helpers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1",
  "prometheus-client>=0.20.0,<1",
  "structlog>=24.4.0,<25",
  "cv-contracts",
  "cv-utils",
  "cv-status",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_observability"]
