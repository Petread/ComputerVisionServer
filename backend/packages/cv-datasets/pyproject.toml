[project]
name = "cv-datasets"
version = "0.1.0"
description = "Dataset export adapters, validation, and immutable snapshot materialization"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.2,<1",
  "pydantic>=2.9.2,<3",
  "cv-status",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_datasets"]
