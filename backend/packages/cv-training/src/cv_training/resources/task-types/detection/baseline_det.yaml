task_type: detection
recipe_name: baseline_det
recipe_version: 1.2.0
framework: openmmlab-mmyolo
trainer_backend: openmmlab-mmyolo
architecture_family: yolo
architecture_version: v8
supported_sizes:
  - n
  - s
  - m
  - l
  - x
image_size: 640
epochs: 50
batch_size: 16
learning_rate: 0.01
optimizer: sgd
optimizer_settings:
  momentum: 0.937
  weight_decay: 0.0005
pretrained: auto
pretrained_checkpoint: auto
scratch_training_min_items: 2000
checkpoint_interval_steps: 25
early_stopping_patience: 40
early_stopping_min_delta: 0.0
max_keep_ckpts: 5
best_metric_name: map_50_95
best_metric_mode: max
nms_iou_threshold: 0.65
score_threshold: 0.25
max_detections: 300
