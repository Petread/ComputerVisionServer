task_type: classification
recipe_name: baseline_cls_torchvision
recipe_version: 1.2.0
framework: torchvision
trainer_backend: torchvision-classification
backbone: auto
image_size: 224
optimizer: adamw
optimizer_settings:
  weight_decay: 0.0005
learning_rate: 0.0008
epochs: 30
batch_size: 32
checkpoint_interval_steps: 20
early_stopping_patience: 30
early_stopping_min_delta: 0.0
best_metric_name: f1_macro
best_metric_mode: max
max_keep_ckpts: 5
pretrained: auto
pretrained_checkpoint: auto
scratch_training_min_items: 2000
onnx_opset: 13
normalize:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
postprocessing:
  confidence_threshold_default: 0.5
  top_k: 5
