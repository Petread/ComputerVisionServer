[project]
name = "cv-training"
version = "0.1.0"
description = "Shared training runtime, recipe, artifact, and trainer abstractions"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "cv-core",
  "cv-db",
  "cv-datasets",
  "cv-status",
  "Pillow>=10.4.0,<12",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_training"]

[tool.hatch.build.targets.wheel.force-include]
"src/cv_training/resources" = "cv_training/resources"
