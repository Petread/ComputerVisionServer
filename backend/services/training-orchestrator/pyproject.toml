[project]
name = "training-orchestrator"
version = "0.1.0"
description = "Training job API and queue submission runtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1",
  "redis>=5.0.8,<6",
  "rq>=1.16.2,<2",
  "uvicorn[standard]>=0.30.6,<1",
  "cv-core",
  "cv-contracts",
  "cv-db",
  "cv-training",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training_orchestrator"]
