[project]
name = "camera-media"
version = "0.1.0"
description = "Single-owner camera acquisition and NVENC stream publication"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1",
  "numpy>=1.26,<3",
  "uvicorn[standard]>=0.30.6,<1",
  "cv-core",
  "cv-contracts",
  "cv-db",
  "cv-runtime",
  "cv-status",
  "realtime-executor",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camera_media"]
