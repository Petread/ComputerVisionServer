[project]
name = "admin-api"
version = "0.1.0"
description = "Control-plane API for authentication, status aggregation, and operator dashboard flows"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1",
  "alembic>=1.13.2,<2",
  "httpx>=0.27.2,<1",
  "redis>=5.0.8,<6",
  "rq>=1.16.2,<2",
  "uvicorn[standard]>=0.30.6,<1",
  "websockets>=13.0.1,<14",
  "cv-core",
  "cv-contracts",
  "cv-datasets",
  "cv-db",
  "cv-status",
  "cv-utils",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admin_api"]
