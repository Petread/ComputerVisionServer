[project]
name = "capture-service"
version = "0.1.0"
description = "Runtime capture service for Label Studio full-frame and ROI ingestion"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.30.6,<1",
  "cv-core",
  "cv-contracts",
  "cv-db",
  "cv-datasets",
  "cv-runtime",
  "cv-status",
  "cv-utils",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capture_service"]
