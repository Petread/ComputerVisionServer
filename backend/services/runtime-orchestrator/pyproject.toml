[project]
name = "runtime-orchestrator"
version = "0.1.0"
description = "Runtime execution lease, admission, and recovery service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.30.6,<1",
  "cv-core",
  "cv-contracts",
  "cv-db",
  "cv-deploy",
  "cv-runtime",
  "cv-status",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime_orchestrator"]
