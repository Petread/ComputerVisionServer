[project]
name = "runtime-admin-api"
version = "0.1.0"
description = "Operator-facing runtime-plane API for channel-driven vision execution"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.30.6,<1",
  "cv-core",
  "cv-contracts",
  "cv-db",
  "cv-edge",
  "cv-runtime",
  "cv-status",
  "cv-utils",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime_admin_api"]
