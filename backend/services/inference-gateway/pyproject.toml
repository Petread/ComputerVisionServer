[project]
name = "inference-gateway"
version = "0.1.0"
description = "Shared inference gateway codebase with isolated realtime and batch runtimes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27.0,<1",
  "numpy>=1.26.0,<3",
  "onnxruntime>=1.19.0,<2 ; python_version == '3.11' and platform_system == 'Linux' and platform_machine == 'x86_64'",
  "pillow>=10.4.0,<12",
  "redis>=5.0.8,<6",
  "rq>=1.16.2,<2",
  "uvicorn[standard]>=0.30.6,<1",
  "anomalib[openvino]>=1.2,<3 ; platform_system == 'Linux'",
  "openvino>=2024.0,<2026 ; platform_system == 'Linux'",
  "cv-core",
  "cv-contracts",
  "cv-datasets",
  "cv-deploy",
  "cv-db",
  "cv-status",
  "cv-utils",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_gateway"]
