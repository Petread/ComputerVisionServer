[project]
name = "operations-agent"
version = "0.1.0"
description = "Internal agent for guarded offline update planning and targeted container restarts"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.30.6,<1",
  "cv-core",
  "cv-contracts",
  "cv-utils",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/operations_agent"]
