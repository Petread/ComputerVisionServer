components:
  schemas:
    AreaDetail:
      properties:
        name:
          type: string
          maxLength: 160
          minLength: 1
          title: Name
        id:
          type: string
          title: Id
      additionalProperties: false
      type: object
      required:
      - name
      - id
      title: AreaDetail
    AreaWrite:
      properties:
        name:
          type: string
          maxLength: 160
          minLength: 1
          title: Name
      additionalProperties: false
      type: object
      required:
      - name
      title: AreaWrite
    Body_upload_channel_test_file_api_v1_runtime_channel_test_files_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_channel_test_file_api_v1_runtime_channel_test_files_post
    Body_upload_edge_software_api_v1_runtime_edge_software_packages_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_edge_software_api_v1_runtime_edge_software_packages_post
    EdgeAdmissionCheck:
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{2,119}$
          title: Key
        outcome:
          type: string
          enum:
          - pass
          - warning
          - fail
          title: Outcome
        message:
          type: string
          maxLength: 1000
          minLength: 1
          title: Message
        detail:
          additionalProperties: true
          type: object
          title: Detail
      additionalProperties: false
      type: object
      required:
      - key
      - outcome
      - message
      title: EdgeAdmissionCheck
    EdgeAdmissionReport:
      properties:
        schema_version:
          type: string
          const: edge.workload.admission.v1
          title: Schema Version
          default: edge.workload.admission.v1
        status:
          type: string
          enum:
          - admitted
          - rejected
          title: Status
        edge_device_id:
          type: string
          maxLength: 64
          minLength: 3
          title: Edge Device Id
        capability_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Capability Digest
        checked_at:
          type: string
          title: Checked At
        checks:
          items:
            $ref: '#/components/schemas/EdgeAdmissionCheck'
          type: array
          title: Checks
      additionalProperties: false
      type: object
      required:
      - status
      - edge_device_id
      - capability_digest
      - checked_at
      title: EdgeAdmissionReport
    EdgeArtifactDescriptor:
      properties:
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Sha256
        size_bytes:
          type: integer
          minimum: 0.0
          title: Size Bytes
        kind:
          type: string
          enum:
          - onnx_model
          - label_map
          - pipeline_graph
          - runtime_plugin
          - configuration
          - golden_input
          - other
          title: Kind
        file_name:
          type: string
          maxLength: 255
          minLength: 1
          title: File Name
        media_type:
          type: string
          maxLength: 160
          minLength: 1
          title: Media Type
          default: application/octet-stream
      additionalProperties: false
      type: object
      required:
      - sha256
      - size_bytes
      - kind
      - file_name
      title: EdgeArtifactDescriptor
    EdgeCameraAdapterCapability:
      properties:
        adapter:
          type: string
          maxLength: 64
          minLength: 1
          title: Adapter
        available:
          type: boolean
          title: Available
        provider:
          type: string
          maxLength: 96
          minLength: 1
          title: Provider
        version:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Version
        device_count:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Device Count
        detail:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Detail
      additionalProperties: false
      type: object
      required:
      - adapter
      - available
      - provider
      title: EdgeCameraAdapterCapability
    EdgeCapabilitySnapshot:
      properties:
        schema_version:
          type: string
          const: edge.device.capabilities.v1
          title: Schema Version
          default: edge.device.capabilities.v1
        management_ip:
          type: string
          format: ipv4
          title: Management Ip
          description: Fixed IPv4 address of the Edge device itself.
        platform:
          type: string
          enum:
          - jetson_orin_nano
          - jetson_agx_orin
          - windows_11
          - simulated
          title: Platform
        architecture:
          type: string
          maxLength: 64
          minLength: 1
          title: Architecture
        os_version:
          type: string
          maxLength: 160
          minLength: 1
          title: Os Version
        jetpack_version:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Jetpack Version
        l4t_version:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: L4T Version
        cuda_version:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Cuda Version
        tensorrt_version:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Tensorrt Version
        deepstream_version:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Deepstream Version
        gpu_model:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Gpu Model
        gpu_driver_version:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Gpu Driver Version
        gpu_memory_bytes:
          type: integer
          minimum: 0.0
          title: Gpu Memory Bytes
          default: 0
        python_version:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Python Version
        ram_total_bytes:
          type: integer
          minimum: 0.0
          title: Ram Total Bytes
        storage_total_bytes:
          type: integer
          minimum: 0.0
          title: Storage Total Bytes
        storage_free_bytes:
          type: integer
          minimum: 0.0
          title: Storage Free Bytes
        agent_version:
          type: string
          maxLength: 64
          minLength: 1
          title: Agent Version
        runtime_version:
          type: string
          maxLength: 64
          minLength: 1
          title: Runtime Version
        supported_node_types:
          items:
            type: string
          type: array
          title: Supported Node Types
        runtime_code_digest:
          anyOf:
          - type: string
          - type: 'null'
          title: Runtime Code Digest
        node_contract_versions:
          additionalProperties:
            type: integer
          type: object
          title: Node Contract Versions
        software_update_protocol:
          type: integer
          title: Software Update Protocol
          default: 0
