openapi: 3.1.0
info:
  title: CV Platform Model Registry Service
  version: 0.1.0
paths:
  /health/live:
    get:
      tags:
      - health
      summary: Live
      operationId: live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags:
      - health
      summary: Ready
      operationId: ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/startup:
    get:
      tags:
      - health
      summary: Startup
      operationId: startup_health_startup_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /metrics:
    get:
      tags:
      - health
      summary: Metrics
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/registry/model-families:
    get:
      tags:
      - registry
      summary: Get Model Families
      operationId: get_model_families_api_v1_registry_model_families_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse_ModelFamilySummary_'
  /api/v1/registry/model-versions:
    get:
      tags:
      - registry
      summary: Get Model Versions
      operationId: get_model_versions_api_v1_registry_model_versions_get
      parameters:
      - name: family_slug
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Family Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse_ModelVersionSummary_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/registry/model-versions/compare:
    get:
      tags:
      - registry
      summary: Compare Versions
      operationId: compare_versions_api_v1_registry_model_versions_compare_get
      parameters:
      - name: model_version_ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
          title: Model Version Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersionComparison'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/registry/model-versions/{model_version_id}:
    get:
      tags:
      - registry
      summary: Get Model Version
      operationId: get_model_version_api_v1_registry_model_versions__model_version_id__get
      parameters:
      - name: model_version_id
        in: path
        required: true
        schema:
          type: string
          title: Model Version Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersionDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/registry/model-versions/{model_version_id}:approve:
    post:
      tags:
      - registry
      summary: Approve Model Version
      operationId: approve_model_version_api_v1_registry_model_versions__model_version_id__approve_post
      parameters:
      - name: model_version_id
        in: path
        required: true
        schema:
          type: string
          title: Model Version Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelApprovalRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentApprovalRecordSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/registry/model-versions/{model_version_id}:mark-rollback-target:
    post:
      tags:
      - registry
      summary: Mark Model Version As Rollback Target
      operationId: mark_model_version_as_rollback_target_api_v1_registry_model_versions__model_version_id__mark_rollback_target_post
      parameters:
      - name: model_version_id
        in: path
        required: true
        schema:
          type: string
          title: Model Version Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackTargetRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersionDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/registry/model-versions/{model_version_id}:archive:
    post:
      tags:
      - registry
      summary: Archive Model Version Route
      operationId: archive_model_version_route_api_v1_registry_model_versions__model_version_id__archive_post
      parameters:
      - name: model_version_id
        in: path
        required: true
        schema:
          type: string
          title: Model Version Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelLifecycleCommandRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersionDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/registry/model-versions/{model_version_id}:reject:
    post:
      tags:
      - registry
      summary: Reject Model Version Route
      operationId: reject_model_version_route_api_v1_registry_model_versions__model_version_id__reject_post
      parameters:
      - name: model_version_id
        in: path
        required: true
        schema:
          type: string
          title: Model Version Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelLifecycleCommandRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersionDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DeploymentApprovalRecordSummary:
      properties:
        approval_record_id:
          type: string
          title: Approval Record Id
        model_version_id:
          type: string
          title: Model Version Id
        target_path:
          $ref: '#/components/schemas/TargetPath'
        approval_scope:
          $ref: '#/components/schemas/DeploymentApprovalScope'
        status:
          $ref: '#/components/schemas/DeploymentApprovalStatus'
        decided_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Decided By
        decided_at:
          type: string
          title: Decided At
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        promotion_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Promotion Id
        deployment_release_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Deployment Release Id
      type: object
      required:
      - approval_record_id
      - model_version_id
      - target_path
      - approval_scope
      - status
      - decided_at
      title: DeploymentApprovalRecordSummary
    DeploymentApprovalScope:
      type: string
      enum:
      - staging
      - production
      title: DeploymentApprovalScope
    DeploymentApprovalStatus:
      type: string
      enum:
      - approved
      - rejected
      title: DeploymentApprovalStatus
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthCheck:
      properties:
        name:
          type: string
          title: Name
        state:
          $ref: '#/components/schemas/HealthState'
        detail:
          type: string
          title: Detail
        observed_at:
          type: string
          title: Observed At
      type: object
      required:
      - name
      - state
      - detail
      - observed_at
      title: HealthCheck
    HealthResponse:
      properties:
        service:
          anyOf:
          - $ref: '#/components/schemas/ServiceName'
          - type: string
          title: Service
        state:
          $ref: '#/components/schemas/HealthState'
        checks:
          items:
            $ref: '#/components/schemas/HealthCheck'
          type: array
          title: Checks
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      type: object
      required:
      - service
      - state
      - checks
      - meta
      title: HealthResponse
    HealthState:
      type: string
      enum:
      - ok
      - degraded
      - down
      title: HealthState
    ListResponse_ModelFamilySummary_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ModelFamilySummary'
          type: array
          title: Items
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      type: object
      required:
      - items
      - meta
      title: ListResponse[ModelFamilySummary]
    ListResponse_ModelVersionSummary_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ModelVersionSummary'
          type: array
          title: Items
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      type: object
      required:
      - items
      - meta
      title: ListResponse[ModelVersionSummary]
    ModelApprovalRequest:
      properties:
        target_path:
          $ref: '#/components/schemas/TargetPath'
        approval_scope:
          $ref: '#/components/schemas/DeploymentApprovalScope'
        notes:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Notes
      type: object
      required:
      - target_path
      - approval_scope
      title: ModelApprovalRequest
    ModelArchitectureSummary:
      properties:
        task_type:
          $ref: '#/components/schemas/TaskType'
        family:
          type: string
          maxLength: 64
          minLength: 2
          title: Family
        version:
          type: string
          maxLength: 32
          minLength: 1
          title: Version
        size:
          type: string
          maxLength: 16
          minLength: 1
          title: Size
        display_name:
          type: string
          maxLength: 160
          minLength: 3
          title: Display Name
        internal_key:
          type: string
          maxLength: 160
          minLength: 3
          title: Internal Key
      type: object
      required:
      - task_type
      - family
      - version
      - size
      - display_name
      - internal_key
      title: ModelArchitectureSummary
    ModelFamilySummary:
      properties:
        model_family_id:
          type: string
          title: Model Family Id
        slug:
          type: string
          title: Slug
        task_type:
          $ref: '#/components/schemas/TaskType'
        architecture:
          $ref: '#/components/schemas/ModelArchitectureSummary'
        template_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Template Key
        template_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Template Version
        promotion_policy:
          anyOf:
          - $ref: '#/components/schemas/PromotionCriteriaPolicy'
          - type: 'null'
        contract_major:
          type: integer
          title: Contract Major
        version_count:
          type: integer
          title: Version Count
          default: 0
        latest_model_version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Model Version Id
        latest_status:
          anyOf:
          - $ref: '#/components/schemas/ModelLifecycleStatus'
          - type: 'null'
      type: object
      required:
      - model_family_id
      - slug
      - task_type
      - architecture
      - contract_major
      title: ModelFamilySummary
    ModelLifecycleCommandRequest:
      properties:
        reason:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Reason
      type: object
      title: ModelLifecycleCommandRequest
    ModelLifecycleStatus:
      type: string
      enum:
      - draft
      - trained
      - validated
      - staged
      - production
      - archived
      - rejected
      title: ModelLifecycleStatus
    ModelLineageSummary:
      properties:
        dataset_snapshot_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Snapshot Id
        code_revision:
          anyOf:
          - type: string
          - type: 'null'
          title: Code Revision
        training_job_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Training Job Id
        mlflow_run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Mlflow Run Id
        dvc_references:
          additionalProperties: true
          type: object
          title: Dvc References
        reproducibility_metadata:
          additionalProperties: true
          type: object
          title: Reproducibility Metadata
      type: object
      title: ModelLineageSummary
    ModelPromotionSummary:
      properties:
        promotion_id:
          type: string
          title: Promotion Id
        target_path:
          $ref: '#/components/schemas/TargetPath'
        status:
          $ref: '#/components/schemas/PromotionStatus'
        requested_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Requested By
        deployment_release_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Deployment Release Id
        rollback_candidate:
          type: boolean
          title: Rollback Candidate
          default: false
        rollback_marked_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Rollback Marked At
        validated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Validated At
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      type: object
      required:
      - promotion_id
      - target_path
      - status
      title: ModelPromotionSummary
    ModelVersionComparison:
      properties:
        versions:
          items:
            $ref: '#/components/schemas/ModelVersionSummary'
          type: array
          title: Versions
        metrics:
          items:
            $ref: '#/components/schemas/ModelVersionComparisonMetric'
          type: array
          title: Metrics
        lineage_fields:
          items:
            $ref: '#/components/schemas/ModelVersionComparisonField'
          type: array
          title: Lineage Fields
      type: object
      required:
      - versions
      - metrics
      - lineage_fields
      title: ModelVersionComparison
    ModelVersionComparisonField:
      properties:
        field_name:
          type: string
          title: Field Name
        values:
          additionalProperties:
            anyOf:
            - type: string
            - type: 'null'
          type: object
          title: Values
      type: object
      required:
      - field_name
      title: ModelVersionComparisonField
    ModelVersionComparisonMetric:
      properties:
        metric_name:
          type: string
          title: Metric Name
        values:
          additionalProperties:
            anyOf:
            - type: number
            - type: 'null'
          type: object
          title: Values
      type: object
      required:
      - metric_name
      title: ModelVersionComparisonMetric
    ModelVersionDetail:
      properties:
        model_version_id:
          type: string
          title: Model Version Id
        model_family_id:
          type: string
          title: Model Family Id
        model_family_slug:
          type: string
          title: Model Family Slug
        version_no:
          type: integer
          title: Version No
        status:
          $ref: '#/components/schemas/ModelLifecycleStatus'
        architecture:
          $ref: '#/components/schemas/ModelArchitectureSummary'
        model_template_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Template Key
        model_template_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Model Template Version
        resolved_training_defaults:
          $ref: '#/components/schemas/TrainingDefaults'
        promotion_policy:
          anyOf:
          - $ref: '#/components/schemas/PromotionCriteriaPolicy'
          - type: 'null'
        training_job_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Training Job Id
        dataset_snapshot_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Snapshot Id
        code_revision:
          anyOf:
          - type: string
          - type: 'null'
          title: Code Revision
        primary_metric_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Primary Metric Name
        primary_metric_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Primary Metric Value
        trainer_mode:
          anyOf:
          - type: string
            enum:
            - real
            - simulation
          - type: 'null'
          title: Trainer Mode
        trainer_backend:
          anyOf:
          - type: string
          - type: 'null'
          title: Trainer Backend
        alias_names:
          items:
            type: string
          type: array
          title: Alias Names
        registry_tags:
          additionalProperties:
            type: string
          type: object
          title: Registry Tags
        target_statuses:
          additionalProperties:
            type: string
          type: object
          title: Target Statuses
        rollback_candidate_targets:
          items:
            $ref: '#/components/schemas/TargetPath'
          type: array
          title: Rollback Candidate Targets
        deployable_for:
          items:
            $ref: '#/components/schemas/TargetPath'
          type: array
          title: Deployable For
        created_at:
          type: string
          title: Created At
        metrics_summary:
          additionalProperties:
            type: number
          type: object
          title: Metrics Summary
        evaluation_summary:
          additionalProperties: true
          type: object
          title: Evaluation Summary
        artifact_manifest_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Artifact Manifest Uri
        artifact_manifest:
          additionalProperties: true
          type: object
          title: Artifact Manifest
        export_manifest_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Export Manifest Uri
        export_manifest:
          additionalProperties: true
          type: object
          title: Export Manifest
        mlflow_registered_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Mlflow Registered Model
        mlflow_model_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Mlflow Model Version
        lineage:
          $ref: '#/components/schemas/ModelLineageSummary'
        immutable_metadata:
          additionalProperties: true
          type: object
          title: Immutable Metadata
        immutable_metadata_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Immutable Metadata Sha256
        artifact_validation:
          additionalProperties: true
          type: object
          title: Artifact Validation
        promotions:
          items:
            $ref: '#/components/schemas/ModelPromotionSummary'
          type: array
          title: Promotions
        approvals:
          items:
            $ref: '#/components/schemas/DeploymentApprovalRecordSummary'
          type: array
          title: Approvals
        archived_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Archived At
        archived_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Archived By
        archive_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Archive Reason
        rejected_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Rejected At
        rejected_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Rejected By
        rejection_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Rejection Reason
      type: object
      required:
      - model_version_id
      - model_family_id
      - model_family_slug
      - version_no
      - status
      - architecture
      - created_at
      title: ModelVersionDetail
    ModelVersionSummary:
      properties:
        model_version_id:
          type: string
          title: Model Version Id
        model_family_id:
          type: string
          title: Model Family Id
        model_family_slug:
          type: string
          title: Model Family Slug
        version_no:
          type: integer
          title: Version No
        status:
          $ref: '#/components/schemas/ModelLifecycleStatus'
        architecture:
          $ref: '#/components/schemas/ModelArchitectureSummary'
        model_template_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Template Key
        model_template_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Model Template Version
        resolved_training_defaults:
          $ref: '#/components/schemas/TrainingDefaults'
        promotion_policy:
          anyOf:
          - $ref: '#/components/schemas/PromotionCriteriaPolicy'
          - type: 'null'
        training_job_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Training Job Id
        dataset_snapshot_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Snapshot Id
        code_revision:
          anyOf:
          - type: string
          - type: 'null'
          title: Code Revision
        primary_metric_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Primary Metric Name
        primary_metric_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Primary Metric Value
        trainer_mode:
          anyOf:
          - type: string
            enum:
            - real
            - simulation
          - type: 'null'
          title: Trainer Mode
        trainer_backend:
          anyOf:
          - type: string
          - type: 'null'
          title: Trainer Backend
        alias_names:
          items:
            type: string
          type: array
          title: Alias Names
        registry_tags:
          additionalProperties:
            type: string
          type: object
          title: Registry Tags
        target_statuses:
          additionalProperties:
            type: string
          type: object
          title: Target Statuses
        rollback_candidate_targets:
          items:
            $ref: '#/components/schemas/TargetPath'
          type: array
          title: Rollback Candidate Targets
        deployable_for:
          items:
            $ref: '#/components/schemas/TargetPath'
          type: array
          title: Deployable For
        created_at:
          type: string
          title: Created At
      type: object
      required:
      - model_version_id
      - model_family_id
      - model_family_slug
      - version_no
      - status
      - architecture
      - created_at
      title: ModelVersionSummary
    PromotionCriteriaPolicy:
      properties:
        criteria:
          items:
            $ref: '#/components/schemas/PromotionCriterion'
          type: array
          minItems: 1
          title: Criteria
        allow_model_override:
          type: boolean
          title: Allow Model Override
          default: true
      type: object
      title: PromotionCriteriaPolicy
    PromotionCriterion:
      properties:
        metric_name:
          type: string
          maxLength: 120
          minLength: 2
          title: Metric Name
        comparison:
          type: string
          enum:
          - gte
          - lte
          title: Comparison
        threshold:
          type: number
          title: Threshold
        phase:
          type: string
          enum:
          - validation
          - evaluation
          title: Phase
          default: evaluation
      type: object
      required:
      - metric_name
      - comparison
      - threshold
      title: PromotionCriterion
    PromotionStatus:
      type: string
      enum:
      - staging_requested
      - staged
      - production_requested
      - production
      - rejected
      - retired
      title: PromotionStatus
    ResponseMeta:
      properties:
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        generated_at:
          type: string
          title: Generated At
      type: object
      required:
      - generated_at
      title: ResponseMeta
    RollbackTargetRequest:
      properties:
        target_path:
          $ref: '#/components/schemas/TargetPath'
        enabled:
          type: boolean
          title: Enabled
          default: true
        notes:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Notes
      type: object
      required:
      - target_path
      title: RollbackTargetRequest
    ServiceName:
      type: string
      enum:
      - admin-api
      - webhook-receiver
      - dataset-service
      - training-orchestrator
      - model-registry-service
      - inference-gateway-rt
      - inference-gateway-batch
      - deployment-controller
      - runtime-admin-api
      - channel-service
      - pipeline-definition-service
      - runtime-orchestrator
      - realtime-executor
      - trigger-executor
      - overlay-service
      - capture-service
      - result-service
      - connector-service
      - control-worker
      - training-worker
      - batch-worker
      - maintenance-worker
      title: ServiceName
    TargetPath:
      type: string
      enum:
      - realtime
      - batch
      title: TargetPath
    TaskType:
      type: string
      enum:
      - classification
      - detection
      - oriented_detection
      - segmentation
      - anomaly
      - temporal_sequence
      title: TaskType
    TrainingDefaults:
      properties:
        epochs:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Epochs
          default: 40
        learning_rate:
          type: number
          maximum: 10.0
          exclusiveMinimum: 0.0
          title: Learning Rate
          default: 0.001
        image_size:
          anyOf:
          - type: integer
            multipleOf: 32.0
            maximum: 4096.0
            minimum: 32.0
          - type: 'null'
          title: Image Size
          default: 640
        batch_size:
          anyOf:
          - type: integer
            maximum: 4096.0
            minimum: 1.0
          - type: 'null'
          title: Batch Size
          default: 8
        optimizer:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 2
          - type: 'null'
          title: Optimizer
          default: auto
        optimizer_settings:
          additionalProperties: true
          type: object
          title: Optimizer Settings
        checkpoint_interval_steps:
          type: integer
          maximum: 100000.0
          minimum: 1.0
          title: Checkpoint Interval Steps
          default: 25
      type: object
      title: TrainingDefaults
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
