openapi: 3.1.0
info:
  title: CV Platform Inference Gateway Batch
  version: 0.1.0
paths:
  /health/live:
    get:
      tags:
      - health
      summary: Live
      operationId: live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags:
      - health
      summary: Ready
      operationId: ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/startup:
    get:
      tags:
      - health
      summary: Startup
      operationId: startup_health_startup_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /metrics:
    get:
      tags:
      - health
      summary: Metrics
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/health:
    get:
      tags:
      - public-batch-inference
      summary: Public Health
      operationId: public_health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/ready:
    get:
      tags:
      - public-batch-inference
      summary: Public Ready
      operationId: public_ready_api_v1_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/models:
    get:
      tags:
      - public-batch-inference
      summary: List Models
      operationId: list_models_api_v1_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicModelListResponse'
  /api/v1/models/{model_id}:
    get:
      tags:
      - public-batch-inference
      summary: Model Detail
      operationId: model_detail_api_v1_models__model_id__get
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          title: Model Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicModelDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/batch/jobs:
    post:
      tags:
      - public-batch-inference
      summary: Submit Batch Job
      operationId: submit_batch_job_api_v1_batch_jobs_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicBatchJobCreateRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBatchJobSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/batch/jobs/{job_id}:
    get:
      tags:
      - public-batch-inference
      summary: Batch Job Detail
      operationId: batch_job_detail_api_v1_batch_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBatchJobDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - public-batch-inference
      summary: Delete Batch Job
      operationId: delete_batch_job_api_v1_batch_jobs__job_id__delete
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBatchJobMutationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/batch/jobs/{job_id}/results:
    get:
      tags:
      - public-batch-inference
      summary: Batch Job Results
      operationId: batch_job_results_api_v1_batch_jobs__job_id__results_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBatchResultsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/batch/internal/jobs:
    post:
      tags:
      - batch-inference
      summary: Submit Batch Job
      operationId: submit_batch_job_api_v1_batch_internal_jobs_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchJobCreateRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchJobSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - batch-inference
      summary: List Jobs
      operationId: list_jobs_api_v1_batch_internal_jobs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse_BatchJobSummary_'
  /api/v1/batch/internal/jobs/{batch_job_id}:
    get:
      tags:
      - batch-inference
      summary: Batch Job Status
      operationId: batch_job_status_api_v1_batch_internal_jobs__batch_job_id__get
      parameters:
      - name: batch_job_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchJobDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/batch/internal/jobs/{batch_job_id}/results:
    get:
      tags:
      - batch-inference
      summary: Batch Job Results
      operationId: batch_job_results_api_v1_batch_internal_jobs__batch_job_id__results_get
      parameters:
      - name: batch_job_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResultResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/batch/internal/jobs/{batch_job_id}/download:
    get:
      tags:
      - batch-inference
      summary: Batch Job Download
      operationId: batch_job_download_api_v1_batch_internal_jobs__batch_job_id__download_get
      parameters:
      - name: batch_job_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/batch/internal/chunks/{batch_job_id}/{chunk_no}:execute:
    post:
      tags:
      - batch-inference
      summary: Execute Chunk
      operationId: execute_chunk_api_v1_batch_internal_chunks__batch_job_id___chunk_no__execute_post
      parameters:
      - name: batch_job_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Job Id
      - name: chunk_no
        in: path
        required: true
        schema:
          type: integer
          title: Chunk No
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Execute Chunk Api V1 Batch Internal Chunks  Batch
                  Job Id   Chunk No  Execute Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/batch/models/capabilities:
    get:
      tags:
      - batch-inference
      summary: Batch Capabilities
      operationId: batch_capabilities_api_v1_batch_models_capabilities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCapabilitiesResponse'
  /api/v1/batch/models/status:
    get:
      tags:
      - batch-inference
      summary: Batch Status
      operationId: batch_status_api_v1_batch_models_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelStatusResponse'
components:
  schemas:
    AnomalyHeatmap:
      properties:
        format:
          type: string
          const: png_base64
          title: Format
          default: png_base64
        data:
          type: string
          minLength: 1
          title: Data
        width:
          type: integer
          minimum: 1.0
          title: Width
        height:
          type: integer
          minimum: 1.0
          title: Height
        min_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Min Value
        max_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Value
        colormap:
          type: string
          maxLength: 64
          minLength: 1
          title: Colormap
          default: turbo
      additionalProperties: false
      type: object
      required:
      - data
      - width
      - height
      title: AnomalyHeatmap
    AnomalyMask:
      properties:
        format:
          type: string
          const: png_base64
          title: Format
          default: png_base64
        data:
          type: string
          minLength: 1
          title: Data
        width:
          type: integer
          minimum: 1.0
          title: Width
        height:
          type: integer
          minimum: 1.0
          title: Height
        threshold:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Threshold
      additionalProperties: false
      type: object
      required:
      - data
      - width
      - height
      - threshold
      title: AnomalyMask
    BatchArtifactSummary:
      properties:
        manifest_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Manifest Uri
        results_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Results Uri
        jsonl_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Jsonl Uri
        bundle_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Bundle Uri
        download_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Download Path
        recoverable:
          type: boolean
          title: Recoverable
          default: false
        incomplete_chunk_nos:
          items:
            type: integer
          type: array
          title: Incomplete Chunk Nos
      additionalProperties: false
      type: object
      title: BatchArtifactSummary
    BatchChunkStatus:
      type: string
      enum:
      - queued
      - running
      - completed
      - failed
      title: BatchChunkStatus
    BatchChunkSummary:
      properties:
        chunk_id:
          type: string
          title: Chunk Id
        chunk_no:
          type: integer
          minimum: 0.0
          title: Chunk No
        status:
          $ref: '#/components/schemas/BatchChunkStatus'
        retry_count:
          type: integer
          minimum: 0.0
          title: Retry Count
        input_uri:
          type: string
          title: Input Uri
        output_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Uri
        started_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Finished At
      additionalProperties: false
      type: object
      required:
      - chunk_id
      - chunk_no
      - status
      - retry_count
      - input_uri
      title: BatchChunkSummary
    BatchInputItem:
      properties:
        item_id:
          type: string
          maxLength: 120
          minLength: 1
          title: Item Id
        image_base64:
          type: string
          minLength: 16
          title: Image Base64
        external_ref:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: External Ref
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      additionalProperties: false
      type: object
      required:
      - item_id
      - image_base64
      title: BatchInputItem
    BatchJobCreateRequest:
      properties:
        deployment_target:
          type: string
          maxLength: 120
          minLength: 3
          title: Deployment Target
        deployment_release_id:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 3
          - type: 'null'
          title: Deployment Release Id
        input_manifest_uri:
          anyOf:
          - type: string
            maxLength: 512
            minLength: 3
          - type: 'null'
          title: Input Manifest Uri
        inputs:
          items:
            $ref: '#/components/schemas/BatchInputItem'
          type: array
          title: Inputs
        chunk_size:
          anyOf:
          - type: integer
            maximum: 1024.0
            minimum: 1.0
          - type: 'null'
          title: Chunk Size
        timeout_seconds:
          anyOf:
          - type: integer
            maximum: 3600.0
            minimum: 1.0
          - type: 'null'
          title: Timeout Seconds
        idempotency_key:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 3
          - type: 'null'
          title: Idempotency Key
      additionalProperties: false
      type: object
      required:
      - deployment_target
      title: BatchJobCreateRequest
    BatchJobDetail:
      properties:
        schema_version:
          type: string
          const: inference.batch.job-summary.v1
          title: Schema Version
          default: inference.batch.job-summary.v1
        batch_job_id:
          type: string
          title: Batch Job Id
        deployment_target:
          type: string
          title: Deployment Target
        deployment_release_id:
          type: string
          title: Deployment Release Id
        status:
          $ref: '#/components/schemas/BatchJobStatus'
        created_at:
          type: string
          title: Created At
        progress:
          $ref: '#/components/schemas/BatchJobProgress'
        route:
          $ref: '#/components/schemas/ModelRouteRef'
        input_manifest_uri:
          type: string
          title: Input Manifest Uri
        output_manifest_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Manifest Uri
        submitted_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Submitted By
        started_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Finished At
        resumable:
          type: boolean
          title: Resumable
          default: true
        chunks:
          items:
            $ref: '#/components/schemas/BatchChunkSummary'
          type: array
          title: Chunks
        artifacts:
          $ref: '#/components/schemas/BatchArtifactSummary'
        metrics:
          $ref: '#/components/schemas/LatencyQuantiles'
      additionalProperties: false
      type: object
      required:
      - batch_job_id
      - deployment_target
      - deployment_release_id
      - status
      - created_at
      - progress
      - route
      - input_manifest_uri
      title: BatchJobDetail
    BatchJobProgress:
      properties:
        total_items:
          type: integer
          minimum: 0.0
          title: Total Items
        completed_items:
          type: integer
          minimum: 0.0
          title: Completed Items
        failed_items:
          type: integer
          minimum: 0.0
          title: Failed Items
        total_chunks:
          type: integer
          minimum: 0.0
          title: Total Chunks
        queued_chunks:
          type: integer
          minimum: 0.0
          title: Queued Chunks
        running_chunks:
          type: integer
          minimum: 0.0
          title: Running Chunks
        completed_chunks:
          type: integer
          minimum: 0.0
          title: Completed Chunks
        failed_chunks:
          type: integer
          minimum: 0.0
          title: Failed Chunks
        progress_percent:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Progress Percent
      additionalProperties: false
      type: object
      required:
      - total_items
      - completed_items
      - failed_items
      - total_chunks
      - queued_chunks
      - running_chunks
      - completed_chunks
      - failed_chunks
      - progress_percent
      title: BatchJobProgress
    BatchJobStatus:
      type: string
      enum:
      - accepted
      - queued
      - running
      - completed
      - failed
      - canceled
      title: BatchJobStatus
    BatchJobSummary:
      properties:
        schema_version:
          type: string
          const: inference.batch.job-summary.v1
          title: Schema Version
          default: inference.batch.job-summary.v1
        batch_job_id:
          type: string
          title: Batch Job Id
        deployment_target:
          type: string
          title: Deployment Target
        deployment_release_id:
          type: string
          title: Deployment Release Id
        status:
          $ref: '#/components/schemas/BatchJobStatus'
        created_at:
          type: string
          title: Created At
        progress:
          $ref: '#/components/schemas/BatchJobProgress'
      additionalProperties: false
      type: object
      required:
      - batch_job_id
      - deployment_target
      - deployment_release_id
      - status
      - created_at
      - progress
      title: BatchJobSummary
    BatchResultRecord:
      properties:
        item_id:
          type: string
          title: Item Id
        external_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: External Ref
        status:
          type: string
          enum:
          - completed
          - failed
          title: Status
        labels:
          items:
            $ref: '#/components/schemas/ClassificationLabelScore'
          type: array
          title: Labels
        detections:
          items:
            $ref: '#/components/schemas/DetectionPrediction'
          type: array
          title: Detections
        image_width:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Image Width
        image_height:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Image Height
        segments:
          items:
            $ref: '#/components/schemas/SegmentationPrediction'
          type: array
          title: Segments
        anomaly_score:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Anomaly Score
        predicted_label:
          anyOf:
          - type: string
            enum:
            - normal
            - anomalous
          - type: 'null'
          title: Predicted Label
        is_anomalous:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Anomalous
        threshold:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Threshold
        heatmap:
          anyOf:
          - $ref: '#/components/schemas/AnomalyHeatmap'
          - type: 'null'
        mask:
          anyOf:
          - $ref: '#/components/schemas/AnomalyMask'
          - type: 'null'
        timing:
          anyOf:
          - $ref: '#/components/schemas/InferenceTiming'
          - type: 'null'
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      additionalProperties: false
      type: object
      required:
      - item_id
      - status
      title: BatchResultRecord
    BatchResultResponse:
      properties:
        schema_version:
          type: string
          const: inference.batch.results.v1
          title: Schema Version
          default: inference.batch.results.v1
        batch_job_id:
          type: string
          title: Batch Job Id
        route:
          $ref: '#/components/schemas/ModelRouteRef'
        status:
          $ref: '#/components/schemas/BatchJobStatus'
        items:
          items:
            $ref: '#/components/schemas/BatchResultRecord'
          type: array
          title: Items
        artifacts:
          $ref: '#/components/schemas/BatchArtifactSummary'
        metrics:
          $ref: '#/components/schemas/LatencyQuantiles'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      additionalProperties: false
      type: object
      required:
      - batch_job_id
      - route
      - status
      - meta
      title: BatchResultResponse
    ClassificationLabelScore:
      properties:
        label:
          type: string
          title: Label
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
        rank:
          type: integer
          minimum: 1.0
          title: Rank
      additionalProperties: false
      type: object
      required:
      - label
      - score
      - rank
      title: ClassificationLabelScore
    DeploymentReleaseStatus:
      type: string
      enum:
      - requested
      - packaging
      - repository_sync
      - loading
      - smoke_testing
      - activated
      - deactivated
      - activation_failed
      - rollback_requested
      - rolled_back
      - retired
      title: DeploymentReleaseStatus
    DetectionBox:
      properties:
        x_min:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: X Min
        y_min:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Y Min
        x_max:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: X Max
        y_max:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Y Max
      additionalProperties: false
      type: object
      required:
      - x_min
      - y_min
      - x_max
      - y_max
      title: DetectionBox
    DetectionPoint:
      properties:
        x:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: X
        y:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Y
      additionalProperties: false
      type: object
      required:
      - x
      - y
      title: DetectionPoint
    DetectionPrediction:
      properties:
        label:
          type: string
          title: Label
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
        box:
          $ref: '#/components/schemas/DetectionBox'
        oriented_box:
          anyOf:
          - $ref: '#/components/schemas/OrientedDetectionBox'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - label
      - score
      - box
      title: DetectionPrediction
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthCheck:
