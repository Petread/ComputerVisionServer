components:
  schemas:
    AcceptedJob:
      properties:
        job_id:
          type: string
          title: Job Id
        queue:
          $ref: '#/components/schemas/QueueName'
        status:
          type: string
          title: Status
        accepted_at:
          type: string
          title: Accepted At
      type: object
      required:
      - job_id
      - queue
      - status
      - accepted_at
      title: AcceptedJob
    AnnotationSchemaSummary:
      properties:
        annotation_schema_id:
          type: string
          title: Annotation Schema Id
        task_type:
          $ref: '#/components/schemas/TaskType'
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        target_builder_id:
          type: string
          title: Target Builder Id
        target_builder_version:
          type: string
          title: Target Builder Version
        label_config_sha256:
          type: string
          maxLength: 64
          minLength: 64
          title: Label Config Sha256
        field_names:
          items:
            type: string
          type: array
          title: Field Names
      type: object
      required:
      - annotation_schema_id
      - task_type
      - title
      - description
      - target_builder_id
      - target_builder_version
      - label_config_sha256
      title: AnnotationSchemaSummary
    AnnotationStatistics:
      properties:
        dataset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Id
        label_project_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Label Project Id
        label_studio_project_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Label Studio Project Id
        task_count:
          type: integer
          title: Task Count
          default: 0
        annotated_task_count:
          type: integer
          title: Annotated Task Count
          default: 0
        annotation_count:
          type: integer
          title: Annotation Count
          default: 0
        skipped_annotation_count:
          type: integer
          title: Skipped Annotation Count
          default: 0
        unlabeled_task_count:
          type: integer
          title: Unlabeled Task Count
          default: 0
        draft_task_count:
          type: integer
          title: Draft Task Count
          default: 0
        eligible_task_count:
          type: integer
          title: Eligible Task Count
          default: 0
        submitted_labeled_task_count:
          type: integer
          title: Submitted Labeled Task Count
          default: 0
        submitted_background_task_count:
          type: integer
          title: Submitted Background Task Count
          default: 0
        invalid_task_count:
          type: integer
          title: Invalid Task Count
          default: 0
        class_distribution:
          additionalProperties:
            type: integer
          type: object
          title: Class Distribution
        snapshot_count:
          type: integer
          title: Snapshot Count
          default: 0
        last_activity_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Activity At
      type: object
      title: AnnotationStatistics
    AnomalyHeatmap:
      properties:
        format:
          type: string
