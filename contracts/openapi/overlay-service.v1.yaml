openapi: 3.1.0
info:
  title: CV Platform Overlay Service
  version: 0.1.0
paths:
  /health/live:
    get:
      tags:
      - health
      summary: Live
      operationId: live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags:
      - health
      summary: Ready
      operationId: ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/startup:
    get:
      tags:
      - health
      summary: Startup
      operationId: startup_health_startup_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /metrics:
    get:
      tags:
      - health
      summary: Metrics
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/runtime/boundary:
    get:
      tags:
      - runtime-boundary
      summary: Get Runtime Boundary
      operationId: get_runtime_boundary_api_v1_runtime_boundary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeBoundaryResponse'
  /api/v1/runtime/channels/{channel_id}/overlay/latest:
    get:
      tags:
      - runtime-boundary
      summary: Get Channel Overlay Latest
      operationId: get_channel_overlay_latest_api_v1_runtime_channels__channel_id__overlay_latest_get
      parameters:
      - name: channel_id
        in: path
        required: true
        schema:
          type: string
          title: Channel Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeLiveViewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthCheck:
      properties:
        name:
          type: string
          title: Name
        state:
          $ref: '#/components/schemas/HealthState'
        detail:
          type: string
          title: Detail
        observed_at:
          type: string
          title: Observed At
      type: object
      required:
      - name
      - state
      - detail
      - observed_at
      title: HealthCheck
    HealthResponse:
      properties:
        service:
          anyOf:
          - $ref: '#/components/schemas/ServiceName'
          - type: string
          title: Service
        state:
          $ref: '#/components/schemas/HealthState'
        checks:
          items:
            $ref: '#/components/schemas/HealthCheck'
          type: array
          title: Checks
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      type: object
      required:
      - service
      - state
      - checks
      - meta
      title: HealthResponse
    HealthState:
      type: string
      enum:
      - ok
      - degraded
      - down
      title: HealthState
    ResponseMeta:
      properties:
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        generated_at:
          type: string
          title: Generated At
      type: object
      required:
      - generated_at
      title: ResponseMeta
    RuntimeBoundaryResponse:
      properties:
        schema_version:
          type: string
          const: runtime.boundary.v1
          title: Schema Version
          default: runtime.boundary.v1
        service_name:
          type: string
          title: Service Name
        responsibilities:
          items:
            type: string
          type: array
          title: Responsibilities
        non_responsibilities:
          items:
            type: string
          type: array
          title: Non Responsibilities
      additionalProperties: false
      type: object
      required:
      - service_name
      title: RuntimeBoundaryResponse
    RuntimeLiveDiagnostics:
      properties:
        source_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Type
        source_max_fps:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Source Max Fps
        source_sample_every_n:
          type: integer
          minimum: 1.0
          title: Source Sample Every N
          default: 1
        effective_source_limit_fps:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Effective Source Limit Fps
        pipeline_max_inflight:
          type: integer
          minimum: 1.0
          title: Pipeline Max Inflight
          default: 1
        pipeline_configured_max_inflight:
          type: integer
          minimum: 1.0
          title: Pipeline Configured Max Inflight
          default: 1
        pipeline_global_max_concurrency:
          type: integer
          minimum: 1.0
          title: Pipeline Global Max Concurrency
          default: 1
        pipeline_per_release_max_concurrency:
          type: integer
          minimum: 1.0
          title: Pipeline Per Release Max Concurrency
          default: 1
        pipeline_inflight_limit_reason:
          type: string
          title: Pipeline Inflight Limit Reason
          default: channel_configuration
        pipeline_stateful_nodes:
          items:
            type: string
          type: array
          title: Pipeline Stateful Nodes
        pipeline_frame_samplers:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Pipeline Frame Samplers
        pipeline_node_timings:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Pipeline Node Timings
        pipeline_inference_timings:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Pipeline Inference Timings
        plc_write_outputs:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Plc Write Outputs
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        stream_transport:
          anyOf:
          - type: string
          - type: 'null'
          title: Stream Transport
      additionalProperties: false
      type: object
      title: RuntimeLiveDiagnostics
    RuntimeLiveFrame:
      properties:
        image_base64:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Base64
        mime_type:
          type: string
          title: Mime Type
          default: image/jpeg
        width:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Width
        height:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Height
        source_timestamp:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Timestamp
        captured_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Captured At
        sequence:
          type: integer
          minimum: 0.0
          title: Sequence
          default: 0
        image_context:
          additionalProperties: true
          type: object
          title: Image Context
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      additionalProperties: false
      type: object
      title: RuntimeLiveFrame
    RuntimeLiveMetrics:
      properties:
        fps:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Fps
        source_fps:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Source Fps
        processed_fps:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Processed Fps
        drop_rate_percent:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Drop Rate Percent
        latency_ms:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Latency Ms
        latency_p50_ms:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Latency P50 Ms
        latency_p95_ms:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Latency P95 Ms
        latency_p99_ms:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Latency P99 Ms
        frame_count:
          type: integer
          minimum: 0.0
          title: Frame Count
          default: 0
        acquired_frame_count:
          type: integer
          minimum: 0.0
          title: Acquired Frame Count
          default: 0
        dropped_frame_count:
          type: integer
          minimum: 0.0
          title: Dropped Frame Count
          default: 0
        reconnect_count:
          type: integer
          minimum: 0.0
          title: Reconnect Count
          default: 0
        source_error_count:
          type: integer
          minimum: 0.0
          title: Source Error Count
          default: 0
        buffer_depth:
          type: integer
          minimum: 0.0
          title: Buffer Depth
          default: 0
        output_stream_fps:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Output Stream Fps
        stream_dropped_frame_count:
          type: integer
          minimum: 0.0
          title: Stream Dropped Frame Count
          default: 0
        encode_latency_ms:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Encode Latency Ms
        stream_publication_latency_ms:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Stream Publication Latency Ms
        connected_clients:
          type: integer
          minimum: 0.0
          title: Connected Clients
          default: 0
        gpu_encoder_available:
          type: boolean
          title: Gpu Encoder Available
          default: false
        overlay_fps:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Overlay Fps
        dropped_overlay_frame_count:
          type: integer
          minimum: 0.0
          title: Dropped Overlay Frame Count
          default: 0
        stale_overlay_count:
          type: integer
          minimum: 0.0
          title: Stale Overlay Count
          default: 0
        last_frame_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Frame At
        stage_timings_ms:
          additionalProperties:
            type: number
          type: object
          title: Stage Timings Ms
      additionalProperties: false
      type: object
      title: RuntimeLiveMetrics
    RuntimeLiveSourceHealth:
      properties:
        state:
          $ref: '#/components/schemas/HealthState'
          default: down
        status_text:
          type: string
          title: Status Text
          default: No live source
        connected:
          type: boolean
          title: Connected
          default: false
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
        reconnect_count:
          type: integer
          minimum: 0.0
          title: Reconnect Count
          default: 0
        source_error_count:
          type: integer
          minimum: 0.0
          title: Source Error Count
          default: 0
      additionalProperties: false
      type: object
      title: RuntimeLiveSourceHealth
    RuntimeLiveViewResponse:
      properties:
        schema_version:
          type: string
          const: runtime.live-view.state.v1
          title: Schema Version
          default: runtime.live-view.state.v1
        state:
          $ref: '#/components/schemas/RuntimeLiveViewState'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      additionalProperties: false
      type: object
      required:
      - state
      - meta
      title: RuntimeLiveViewResponse
    RuntimeLiveViewState:
      properties:
        channel_id:
          type: string
          title: Channel Id
        runtime_instance_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Runtime Instance Id
        actual_state:
          $ref: '#/components/schemas/RuntimeObservedState'
        available:
          type: boolean
          title: Available
          default: false
        stale:
          type: boolean
          title: Stale
          default: false
        display_context_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Context Id
        display_context:
          additionalProperties: true
          type: object
          title: Display Context
        frame:
          anyOf:
          - $ref: '#/components/schemas/RuntimeLiveFrame'
          - type: 'null'
        source_frame:
          anyOf:
          - $ref: '#/components/schemas/RuntimeLiveFrame'
          - type: 'null'
        overlay:
          items:
            $ref: '#/components/schemas/RuntimeOverlayPrimitiveState'
          type: array
          title: Overlay
        layers_available:
          items:
            type: string
          type: array
          title: Layers Available
        metrics:
          $ref: '#/components/schemas/RuntimeLiveMetrics'
        source_health:
          $ref: '#/components/schemas/RuntimeLiveSourceHealth'
        diagnostics:
          $ref: '#/components/schemas/RuntimeLiveDiagnostics'
        recovery_hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Recovery Hint
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
      additionalProperties: false
      type: object
      required:
      - channel_id
      - actual_state
      title: RuntimeLiveViewState
    RuntimeObservedState:
      type: string
      enum:
      - unassigned
      - starting
      - validating
      - loading_pipeline
      - running
      - degraded
      - stopping
      - stopped
      - failed
      - recovering
      title: RuntimeObservedState
    RuntimeOverlayPrimitiveState:
      properties:
        primitive_type:
          type: string
          enum:
          - box
          - polygon
          - point
          - label
          - measurement
          - roi
          - zone
          - motion
          - heatmap
          - mask
          - line
          - axis
          - arrow
          title: Primitive Type
        layer:
          type: string
          maxLength: 64
          title: Layer
          default: overlay
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence
        geometry:
          additionalProperties: true
          type: object
          title: Geometry
        image_context_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Context Id
        display_context_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Context Id
        frame_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Frame Id
        source_timestamp:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Timestamp
        coordinate_system:
          type: string
          maxLength: 64
          title: Coordinate System
          default: image_pixels
        resolution:
          additionalProperties: true
          type: object
          title: Resolution
        object_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Object Id
        source_object_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Object Id
        projected_from_context_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Projected From Context Id
        style:
          additionalProperties: true
          type: object
          title: Style
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      additionalProperties: false
      type: object
      required:
      - primitive_type
      title: RuntimeOverlayPrimitiveState
    ServiceName:
      type: string
      enum:
      - admin-api
      - webhook-receiver
      - dataset-service
      - training-orchestrator
      - model-registry-service
      - inference-gateway-rt
      - inference-gateway-batch
      - deployment-controller
      - runtime-admin-api
      - channel-service
      - pipeline-definition-service
      - runtime-orchestrator
      - realtime-executor
      - trigger-executor
      - overlay-service
      - capture-service
      - result-service
      - connector-service
      - control-worker
      - training-worker
      - batch-worker
      - maintenance-worker
      title: ServiceName
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
