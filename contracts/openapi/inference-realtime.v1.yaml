                $ref: '#/components/schemas/HealthResponse'
  /api/v1/models:
    get:
      tags:
      - public-realtime-inference
      summary: List Models
      operationId: list_models_api_v1_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicModelListResponse'
  /api/v1/models/{model_id}:
    get:
      tags:
      - public-realtime-inference
      summary: Model Detail
      operationId: model_detail_api_v1_models__model_id__get
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          title: Model Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicModelDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/infer/classify:
    post:
      tags:
      - public-realtime-inference
      summary: Classify
      operationId: classify_api_v1_infer_classify_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_classify_api_v1_infer_classify_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicClassificationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/infer/detect:
    post:
      tags:
      - public-realtime-inference
      summary: Detect
      operationId: detect_api_v1_infer_detect_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_detect_api_v1_infer_detect_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDetectionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/infer/segment:
    post:
      tags:
      - public-realtime-inference
      summary: Segment
      operationId: segment_api_v1_infer_segment_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_segment_api_v1_infer_segment_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSegmentationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/infer/anomaly:
    post:
      tags:
      - public-realtime-inference
      summary: Anomaly
      operationId: anomaly_api_v1_infer_anomaly_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_anomaly_api_v1_infer_anomaly_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAnomalyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/realtime/classify:
    post:
      tags:
      - realtime-inference
      summary: Classify Realtime
      operationId: classify_realtime_api_v1_realtime_classify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeClassifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationInferenceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/realtime/classify-bytes:
    post:
      tags:
      - realtime-inference
      summary: Classify Realtime Bytes
      operationId: classify_realtime_bytes_api_v1_realtime_classify_bytes_post
      parameters:
      - name: deployment_target
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 120
          title: Deployment Target
      - name: deployment_release_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 3
            maxLength: 64
          - type: 'null'
          title: Deployment Release Id
      - name: timeout_ms
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 30000
            minimum: 50
          - type: 'null'
          title: Timeout Ms
      - name: top_k
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 1
          title: Top K
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationInferenceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/realtime/detect:
    post:
      tags:
      - realtime-inference
      summary: Detect Realtime
      operationId: detect_realtime_api_v1_realtime_detect_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeDetectRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionInferenceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/realtime/detect-bytes:
    post:
      tags:
      - realtime-inference
      summary: Detect Realtime Bytes
      operationId: detect_realtime_bytes_api_v1_realtime_detect_bytes_post
      parameters:
      - name: deployment_target
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 120
          title: Deployment Target
      - name: deployment_release_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 3
            maxLength: 64
          - type: 'null'
          title: Deployment Release Id
      - name: timeout_ms
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 30000
            minimum: 50
          - type: 'null'
          title: Timeout Ms
      - name: max_detections
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Max Detections
      - name: score_threshold
        in: query
        required: false
        schema:
          type: number
          maximum: 1
          minimum: 0
          default: 0.35
          title: Score Threshold
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionInferenceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/realtime/segment:
    post:
      tags:
      - realtime-inference
      summary: Segment Realtime
      operationId: segment_realtime_api_v1_realtime_segment_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeSegmentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentationInferenceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/realtime/segment-bytes:
    post:
      tags:
      - realtime-inference
      summary: Segment Realtime Bytes
      operationId: segment_realtime_bytes_api_v1_realtime_segment_bytes_post
      parameters:
      - name: deployment_target
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 120
          title: Deployment Target
      - name: deployment_release_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 3
            maxLength: 64
          - type: 'null'
          title: Deployment Release Id
      - name: timeout_ms
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 30000
            minimum: 50
          - type: 'null'
          title: Timeout Ms
      - name: max_segments
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 50
          title: Max Segments
      - name: score_threshold
        in: query
        required: false
        schema:
          type: number
          maximum: 1
          minimum: 0
          default: 0.35
          title: Score Threshold
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentationInferenceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/realtime/anomaly:
    post:
      tags:
      - realtime-inference
      summary: Anomaly Realtime
      operationId: anomaly_realtime_api_v1_realtime_anomaly_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeAnomalyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnomalyInferenceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/realtime/anomaly-bytes:
    post:
      tags:
      - realtime-inference
      summary: Anomaly Realtime Bytes
      operationId: anomaly_realtime_bytes_api_v1_realtime_anomaly_bytes_post
      parameters:
      - name: deployment_target
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 120
          title: Deployment Target
      - name: deployment_release_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 3
            maxLength: 64
          - type: 'null'
          title: Deployment Release Id
      - name: timeout_ms
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 30000
            minimum: 50
          - type: 'null'
          title: Timeout Ms
      - name: threshold
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 1
            minimum: 0
          - type: 'null'
          title: Threshold
      - name: return_mask
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Return Mask
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnomalyInferenceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/realtime/predict:
    post:
      tags:
      - realtime-inference
      summary: Predict Realtime
      operationId: predict_realtime_api_v1_realtime_predict_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeClassifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeInferenceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/realtime/models/capabilities:
    get:
      tags:
      - realtime-inference
      summary: Realtime Capabilities
      operationId: realtime_capabilities_api_v1_realtime_models_capabilities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCapabilitiesResponse'
  /api/v1/realtime/models/status:
    get:
      tags:
      - realtime-inference
      summary: Realtime Status
      operationId: realtime_status_api_v1_realtime_models_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelStatusResponse'
components:
  schemas:
    AnomalyHeatmap:
      properties:
        format:
          type: string
          const: png_base64
          title: Format
          default: png_base64
        data:
          type: string
          minLength: 1
          title: Data
        width:
          type: integer
          minimum: 1.0
          title: Width
        height:
          type: integer
          minimum: 1.0
          title: Height
        min_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Min Value
        max_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Value
        colormap:
          type: string
          maxLength: 64
          minLength: 1
          title: Colormap
          default: turbo
      additionalProperties: false
      type: object
      required:
      - data
      - width
      - height
      title: AnomalyHeatmap
    AnomalyInferenceResponse:
      properties:
        schema_version:
          type: string
          const: inference.anomaly.response.v1
          title: Schema Version
          default: inference.anomaly.response.v1
        request_id:
          type: string
          title: Request Id
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        deployment_target:
          type: string
          title: Deployment Target
        route:
          $ref: '#/components/schemas/ModelRouteRef'
        architecture:
          $ref: '#/components/schemas/ModelArchitectureSummary'
        warm_model:
          type: boolean
          title: Warm Model
        timing:
          $ref: '#/components/schemas/InferenceTiming'
        anomaly_score:
          type: number
          minimum: 0.0
          title: Anomaly Score
        predicted_label:
          type: string
          enum:
          - normal
          - anomalous
          title: Predicted Label
        is_anomalous:
          type: boolean
          title: Is Anomalous
        threshold:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Threshold
        heatmap:
          $ref: '#/components/schemas/AnomalyHeatmap'
        mask:
          anyOf:
          - $ref: '#/components/schemas/AnomalyMask'
          - type: 'null'
        image_width:
          type: integer
          minimum: 1.0
          title: Image Width
        image_height:
          type: integer
          minimum: 1.0
          title: Image Height
        model_metadata:
          additionalProperties: true
          type: object
          title: Model Metadata
      additionalProperties: false
      type: object
      required:
      - request_id
      - deployment_target
      - route
      - architecture
      - warm_model
      - timing
      - anomaly_score
      - predicted_label
      - is_anomalous
      - threshold
      - heatmap
      - image_width
      - image_height
      title: AnomalyInferenceResponse
    AnomalyMask:
      properties:
        format:
          type: string
          const: png_base64
          title: Format
          default: png_base64
        data:
          type: string
          minLength: 1
          title: Data
        width:
          type: integer
          minimum: 1.0
          title: Width
        height:
          type: integer
          minimum: 1.0
          title: Height
        threshold:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Threshold
      additionalProperties: false
      type: object
      required:
      - data
      - width
      - height
      - threshold
      title: AnomalyMask
    Body_anomaly_api_v1_infer_anomaly_post:
      properties:
        model_id:
          type: string
          maxLength: 120
          minLength: 3
          title: Model Id
        image:
          type: string
          contentMediaType: application/octet-stream
          title: Image
        threshold:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Threshold
        return_mask:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Return Mask
        timeout_ms:
          anyOf:
          - type: integer
            maximum: 30000.0
            minimum: 50.0
          - type: 'null'
          title: Timeout Ms
      type: object
      required:
      - model_id
      - image
      title: Body_anomaly_api_v1_infer_anomaly_post
    Body_classify_api_v1_infer_classify_post:
      properties:
        model_id:
          type: string
          maxLength: 120
          minLength: 3
          title: Model Id
        image:
          type: string
          contentMediaType: application/octet-stream
          title: Image
        top_k:
          anyOf:
          - type: integer
            maximum: 20.0
            minimum: 1.0
          - type: 'null'
          title: Top K
        timeout_ms:
          anyOf:
          - type: integer
            maximum: 30000.0
            minimum: 50.0
          - type: 'null'
          title: Timeout Ms
      type: object
      required:
      - model_id
      - image
      title: Body_classify_api_v1_infer_classify_post
    Body_detect_api_v1_infer_detect_post:
      properties:
        model_id:
          type: string
          maxLength: 120
          minLength: 3
          title: Model Id
        image:
          type: string
          contentMediaType: application/octet-stream
          title: Image
        threshold:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Threshold
        iou_threshold:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Iou Threshold
        max_detections:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 1.0
          - type: 'null'
          title: Max Detections
        timeout_ms:
          anyOf:
          - type: integer
            maximum: 30000.0
            minimum: 50.0
          - type: 'null'
          title: Timeout Ms
      type: object
      required:
      - model_id
      - image
      title: Body_detect_api_v1_infer_detect_post
    Body_segment_api_v1_infer_segment_post:
      properties:
        model_id:
          type: string
          maxLength: 120
          minLength: 3
          title: Model Id
        image:
          type: string
          contentMediaType: application/octet-stream
          title: Image
        threshold:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Threshold
        max_segments:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 1.0
          - type: 'null'
          title: Max Segments
        timeout_ms:
          anyOf:
          - type: integer
            maximum: 30000.0
            minimum: 50.0
          - type: 'null'
          title: Timeout Ms
      type: object
      required:
      - model_id
      - image
      title: Body_segment_api_v1_infer_segment_post
    ClassificationInferenceResponse:
      properties:
        schema_version:
          type: string
          const: inference.classification.response.v1
          title: Schema Version
          default: inference.classification.response.v1
        request_id:
          type: string
          title: Request Id
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        deployment_target:
          type: string
          title: Deployment Target
        route:
          $ref: '#/components/schemas/ModelRouteRef'
        architecture:
          $ref: '#/components/schemas/ModelArchitectureSummary'
        warm_model:
          type: boolean
          title: Warm Model
        timing:
          $ref: '#/components/schemas/InferenceTiming'
        labels:
          items:
            $ref: '#/components/schemas/ClassificationLabelScore'
          type: array
          title: Labels
      additionalProperties: false
      type: object
      required:
      - request_id
      - deployment_target
      - route
      - architecture
      - warm_model
      - timing
      title: ClassificationInferenceResponse
    ClassificationLabelScore:
      properties:
        label:
          type: string
          title: Label
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
        rank:
          type: integer
          minimum: 1.0
          title: Rank
      additionalProperties: false
      type: object
      required:
      - label
      - score
      - rank
      title: ClassificationLabelScore
    DeploymentReleaseStatus:
      type: string
      enum:
      - requested
      - packaging
      - repository_sync
      - loading
      - smoke_testing
      - activated
      - deactivated
      - activation_failed
      - rollback_requested
      - rolled_back
      - retired
      title: DeploymentReleaseStatus
    DetectionBox:
      properties:
        x_min:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: X Min
        y_min:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Y Min
        x_max:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: X Max
        y_max:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Y Max
      additionalProperties: false
      type: object
      required:
      - x_min
      - y_min
      - x_max
      - y_max
      title: DetectionBox
    DetectionInferenceResponse:
      properties:
        schema_version:
          type: string
          const: inference.detection.response.v1
          title: Schema Version
          default: inference.detection.response.v1
        request_id:
          type: string
          title: Request Id
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        deployment_target:
          type: string
          title: Deployment Target
